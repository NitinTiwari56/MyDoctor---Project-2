<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyDoctor — Smart Healthcare Appointment System</title>
    <meta name="description" content="MyDoctor is a premium healthcare platform for booking doctor appointments, managing schedules, and requesting home visits. Built for patients and doctors." />
    <meta name="theme-color" content="#6366f1" />
    <meta name="author" content="MyDoctor" />
    <link rel="icon" type="image/jpeg" href="%PUBLIC_URL%/favicon.jpg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.jpg" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%2314b8a6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Crect x='38' y='20' width='24' height='60' rx='4' fill='white'/%3E%3Crect x='20' y='38' width='60' height='24' rx='4' fill='white'/%3E%3Ccircle cx='72' cy='72' r='14' fill='%2314b8a6'/%3E%3Ccircle cx='72' cy='72' r='6' fill='%236366f1'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* Critical loading styles — shown before React hydrates */
      body { margin: 0; padding: 0; background: #f8fafc; }
      #root:empty {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        height: 100vh; gap: 16px;
      }
      #root:empty::before {
        content: '';
        width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 8px 32px rgba(99,102,241,.3);
        animation: rootFloat 2s ease-in-out infinite;
      }
      #root:empty::after {
        content: 'MyDoctor';
        font-family: system-ui, sans-serif;
        font-size: .9rem; font-weight: 600;
        color: #94a3b8; letter-spacing: .02em;
        animation: rootPulse 2s ease-in-out infinite;
      }
      @keyframes rootFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes rootPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .4; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <div id="root"></div>
  </body>
</html>
